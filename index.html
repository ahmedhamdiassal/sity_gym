<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيتي جيم - نظام إدارة الجيم</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--pr:#e8590c;--ok:#2b8a3e;--wn:#e67700;--er:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#2c3037;--pr:#ff8a4c;--ok:#51cf66;--wn:#ffa94d;--er:#ff6b6b}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#2c3037;--pr:#ff8a4c;--ok:#51cf66;--wn:#ffa94d;--er:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:20px}
nav{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto}
nav button{flex:1;white-space:nowrap;padding:10px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:0 16px 24px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-size:22px;margin-top:4px}
.stat span{color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
.btn.s{padding:6px 10px;font-size:13px}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}
.tag{padding:2px 10px;border-radius:20px;font-size:12px;color:#fff;white-space:nowrap}
.yes{background:var(--ok)}.no{background:var(--er)}
.w{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-size:13px;font-weight:600}
td input.pi{width:90px;padding:6px}
.acts{display:flex;gap:6px}
.cur{width:90px}
.soonrow td{background:rgba(230,119,0,.14)}
.tag.wn{background:var(--wn)}
.alertb{margin:0 16px 10px;padding:10px 14px;border-radius:10px;background:var(--wn);color:#fff;cursor:pointer;line-height:1.7}
.logo{height:84px;width:auto;border-radius:10px;border:1px solid var(--bd);background:#fff}
.bars{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu);gap:3px}
.bar i{display:block;width:100%;background:var(--pr);border-radius:6px 6px 0 0;min-height:2px}
.lnk{color:var(--er);cursor:pointer;text-decoration:underline}
.ms{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
.chip{background:var(--bg);border:1px solid var(--er);color:var(--tx);padding:4px 10px;border-radius:20px;font-size:13px}
#pa{display:none}@media print{body.pr>*{display:none!important}body.pr>#pa{display:block!important;background:#fff;color:#000;direction:rtl;padding:10px;font-family:Tahoma,Arial,sans-serif}#pa table{width:100%;border-collapse:collapse}#pa td,#pa th{border:1px solid #000;padding:6px;text-align:right;font-size:13px}}
#lk{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#lk .bx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:340px;text-align:center}
#lk .bx input{text-align:center;letter-spacing:6px;font-size:20px;margin:6px 0}
#lk .er{color:var(--er);min-height:20px;font-size:13px;margin:4px 0}
#lk .row2{display:flex;gap:8px;justify-content:center;margin-top:8px}
.hide{display:none}
</style>
</head>

  <button data-t="sett">⚙️ الإعدادات</button>
</nav>
<div id="alertb"></div>
<div id="qb"></div>
<main>
  <section id="dash"></section>
  <section id="mem" class="hide"></section>
  <section id="att" class="hide"></section>
  <section id="pay" class="hide"></section>
  <section id="day" class="hide"></section>
  <section id="msg" class="hide"></section>
  <section id="rep" class="hide"></section>
  <section id="sett" class="hide"></section>
</main>
<div id="pa"></div>
<script>
let D;
try{D=JSON.parse(localStorage.getItem('gym5'))}catch(e){}
D=D||{m:[],p:[],a:[],cur:'ج.م'};
if(!D.d)D.d=[];if(D.cc===undefined)D.cc='20';
D.m.forEach(m=>{if(!m.prices)m.prices=[{from:m.start,price:m.price}]});
const save=()=>{try{localStorage.setItem('gym5',JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const fmt=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const today=()=>fmt(new Date());
const addM=(s,n)=>{const d=new Date(s+'T00:00'),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return fmt(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ar-EG')+' '+esc(D.cur);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// الاشتراك يتجدد تلقائيًا كل شهر من تاريخ البداية
const due=m=>{let n=0;while(n<600&&addM(m.start,n)<=today())n++;return n};
const paidM=m=>D.p.filter(p=>p.mid===m.id).reduce((s,p)=>s+(p.months||1),0);
const debt=m=>Math.max(0,due(m)-paidM(m));
const credit=m=>Math.max(0,paidM(m)-due(m));
const priceAt=(m,d)=>{let p=m.prices[0].price;m.prices.forEach(x=>{if(x.from<=d)p=x.price});return p};
const cyc=(m,i)=>priceAt(m,addM(m.start,i));
const sumC=(m,a,b)=>{let t=0;for(let i=a;i<b;i++)t+=cyc(m,i);return t};
const debtAmt=m=>sumC(m,paidM(m),due(m));
const curPrice=m=>priceAt(m,today());
const nextRenew=m=>addM(m.start,due(m));

// ===== الرقم السري =====
const PK='gym5pw';
const hp=t=>{let a=0xdeadbeef,b=0x41c6ce57;t='cg|'+t;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)};
const getPw=()=>{try{return localStorage.getItem(PK)||''}catch(e){return ''}};
const setPw=v=>{try{localStorage.setItem(PK,hp(v))}catch(e){}};
let memPw='';
function lockUI(o){
  // o: {title,sub,mode:'open'|'ask'|'new', cancel:bool}
  return new Promise(res=>{
    const old=document.getElementById('lk');if(old)old.remove();
    const d=document.createElement('div');d.id='lk';
    const nw=o.mode==='new';
    d.innerHTML=`<div class="bx"><div style="font-size:34px">🔒</div><b>${o.title}</b><p class="mu" style="margin:6px 0 10px">${o.sub||''}</p><input id="lp1" type="password" inputmode="numeric" autocomplete="off" placeholder="${nw?'الرقم السري الجديد':'الرقم السري'}">${nw?'<input id="lp2" type="password" inputmode="numeric" autocomplete="off" placeholder="أعد كتابة الرقم السري">':''}<div class="er" id="le"></div><div class="row2"><button class="btn" id="lok">${nw?'حفظ':'تأكيد'}</button>${o.cancel?'<button class="btn g" id="lcn">إلغاء</button>':''}</div></div>`;
    document.body.appendChild(d);
    const p1=d.querySelector('#lp1'),p2=d.querySelector('#lp2'),er=d.querySelector('#le');
    setTimeout(()=>p1.focus(),50);
    const go_=()=>{
      const v=p1.value;
      if(nw){
        if(v.length<4){er.textContent='الرقم السري لازم 4 خانات على الأقل';return}
        if(v!==p2.value){er.textContent='الرقمين مش متطابقين';return}
        setPw(v);memPw=hp(v);d.remove();res(true);return;
      }
      if(hp(v)===getPw()){memPw=hp(v);d.remove();res(true)}
      else{er.textContent='الرقم السري غلط';p1.value='';p1.focus()}
    };
    d.querySelector('#lok').onclick=go_;
    d.addEventListener('keydown',e=>{if(e.key==='Enter')go_()});
    const c=d.querySelector('#lcn');if(c)c.onclick=()=>{d.remove();res(false)};
  });
}
// فتح البرنامج
function openLock(){
  if(!getPw())return lockUI({title:'اعمل رقم سري للبرنامج',sub:'هيتطلب عند فتح البرنامج وعند حذف أو تعديل أي عضو',mode:'new'});
  return lockUI({title:'سيتي جيم',sub:'اكتب الرقم السري لفتح البرنامج',mode:'open'});
}
// طلب الرقم قبل الحذف / التعديل
function needPin(why){return lockUI({title:'الرقم السري مطلوب',sub:why,mode:'ask',cancel:true})}
async function chPw(){
  if(!await needPin('اكتب الرقم السري الحالي'))return;
  if(await lockUI({title:'رقم سري جديد',sub:'',mode:'new',cancel:true}))alert('تم تغيير الرقم السري ✅');
}


// ===== عدم تجديد / موقوفين =====
const lastP=m=>[...D.p].reverse().find(p=>p.mid===m.id);
const stopped=m=>{const l=lastP(m);return !!(l&&l.skip)};
async function skipM(id){
  const m=D.m.find(x=>x.id===id);if(!m)return;
  if(!await needPin('عدم تجديد شهر للعضو '+m.name))return;
  D.p.push({id:uid(),mid:m.id,amount:0,date:today(),months:1,skip:true});
  save();render();
}
const skipBtn=m=>`<button class="btn s d" onclick="skipM('${m.id}')">عدم تجديد الشهر</button>`;
// ===== رسائل واتساب =====
if(!D.s)D.s={};if(!D.q)D.q=[];
const phn=m=>{const p=(m.phone||'').replace(/\D/g,'').replace(/^0+/,'');return p?((D.cc&&!p.startsWith(D.cc)?D.cc:'')+p):''};
const sigs='\n\nمع تحيات سيتي جيم 🏋️';
const msgR3=m=>`أهلًا ${m.name} 👋\nاشتراكك في سيتي جيم هينتهي ${dleft(m)===0?'النهاردة':dleft(m)===1?'بكرة':'بعد '+dleft(m)+' أيام'} (${nextRenew(m)}).\nهل تود تجديد الاشتراك للشهر القادم؟ ولا هتلغي الشهر القادم؟\nرد علينا بكلمة "تجديد" أو "إلغاء".\n\nصحتك أغلى ما تملك 💪 والاستمرار في التمرين هو سر النشاط والقوة، يلا نكمل مشوارنا سوا.`+sigs;
const msgTh=m=>`أهلًا ${m.name} 👋\nباقي ${dleft(m)} يوم على انتهاء اشتراكك في الجيم (${nextRenew(m)}).\nنتمنى لك دوام الصحة والاستمرارية في التمرين 💪🌟`+sigs;
const expD=m=>addM(m.start,Math.max(paidM(m),due(m)));
const msgPaid=m=>`أهلًا ${m.name} ✅\nتم تجديد اشتراكك اليوم ${today()}.\nوسوف ينتهي الاشتراك في ${expD(m)}.\nشكرًا لثقتك، ونتمنى لك صحة دائمة وتمرين ممتع 💪`+sigs;
function sendLn(m,msg,key){
  const n=phn(m);if(!n)return '<span class="mu">لا يوجد رقم</span>';
  const done=D.s[key];
  return `<a class="btn s ${done?'g':''}" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}" onclick="D.s['${key}']=1;save();setTimeout(msg,300)">${done?'✔ اتبعت (إعادة)':'إرسال واتساب'}</a>`;
}
function pend_(k){
  const t=today(),act=D.m.filter(m=>!stopped(m));
  return k==='th'?act.filter(m=>phn(m)&&!D.s['th:'+m.id+':'+t]):act.filter(m=>phn(m)&&dleft(m)>=0&&dleft(m)<=WIN()&&!D.s['r3:'+m.id+':'+nextRenew(m)]);
}
const WIN=()=>+D.win||5;const selS=new Set(),selT=new Set();
function tgT(id){selT.has(id)?selT.delete(id):selT.add(id);msg()}
function selAllT(){const l=D.m.filter(m=>!stopped(m));l.every(m=>selT.has(m.id))?selT.clear():l.forEach(m=>selT.add(m.id));msg()}
function setWin(v){D.win=Math.max(1,Math.min(30,+v||5));save();render()}
function tgSel(id){selS.has(id)?selS.delete(id):selS.add(id);msg()}
function selAll(){const l=D.m.filter(m=>!stopped(m)&&dleft(m)>=0&&dleft(m)<=WIN());l.every(m=>selS.has(m.id))?selS.clear():l.forEach(m=>selS.add(m.id));msg()}
function nextSend(k){
  let l=pend_(k);if(k==='r3'&&selS.size)l=l.filter(m=>selS.has(m.id));if(k==='th'&&selT.size)l=l.filter(m=>selT.has(m.id));const m=l[0];if(!m)return;
  const key=k==='th'?'th:'+m.id+':'+today():'r3:'+m.id+':'+nextRenew(m);
  D.s[key]=1;save();
  window.open('https://wa.me/'+phn(m)+'?text='+encodeURIComponent(k==='th'?msgTh(m):msgR3(m)),'_blank');
  setTimeout(msg,300);
}
function msg(){
  const t=today(),act=D.m.filter(m=>!stopped(m));
  const r3=act.filter(m=>dleft(m)>=0&&dleft(m)<=WIN()).sort((a,b)=>dleft(a)-dleft(b));
  const nb=(k)=>{const sx=k==='r3'?selS:selT,c=sx.size?pend_(k).filter(m=>sx.has(m.id)).length:pend_(k).length;return c?`<button class="btn" onclick="nextSend('${k}')">▶ ابعت للعضو التالي (${c} متبقي${(k==='r3'?selS:selT).size?' من المحددين':''})</button>`:'<span class="tag">✔ مفيش متبقي</span>'};
  $('#msg').innerHTML=`<div class="card"><b>📩 الرسائل</b><p class="mu">اضغط الزرار وواتساب هيفتح برسالة جاهزة، دوس إرسال وارجع واضغط تاني للعضو اللي بعده.</p></div>
  <div class="card"><div class="row"><b>⏰ قبل انتهاء الاشتراك (تجديد / إلغاء)</b>${nb('r3')}</div><div class="acts" style="margin:8px 0;align-items:center"><span class="mu">اللي باقي له</span><input type="number" min="1" max="30" value="${WIN()}" style="width:70px" onchange="setWin(this.value)"><span class="mu">أيام أو أقل</span><button class="btn s g" onclick="selAll()">تحديد الكل / إلغاء</button></div>${r3.length?r3.map(m=>`<div class="row"><input type="checkbox" style="width:22px;flex:none" ${selS.has(m.id)?'checked':''} onchange="tgSel('${m.id}')"><div>${esc(m.name)}<div class="mu">التجديد ${nextRenew(m)} · باقي ${dleft(m)} يوم</div></div>${sendLn(m,msgR3(m),'r3:'+m.id+':'+nextRenew(m))}${skipBtn(m)}</div>`).join(''):'<p class="mu">لا يوجد أعضاء قربوا على التجديد.</p>'}</div>
  <div class="card"><div class="row"><b>📅 رسالة الخميس</b>${nb('th')}</div><div class="acts" style="margin:8px 0"><button class="btn s g" onclick="selAllT()">تحديد الكل / إلغاء</button><span class="mu">من غير تحديد = الكل</span></div>${act.length?act.map(m=>`<div class="row"><input type="checkbox" style="width:22px;flex:none" ${selT.has(m.id)?'checked':''} onchange="tgT('${m.id}')"><div>${esc(m.name)}<div class="mu">باقي ${dleft(m)} يوم</div></div>${sendLn(m,msgTh(m),'th:'+m.id+':'+t)}</div>`).join(''):'<p class="mu">لا يوجد أعضاء.</p>'}</div>
  <p class="mu">رسالة «تم الدفع والتجديد» بتتفتح فورًا بعد حفظ الدفعة.</p>`;
}
// ===== طباعة =====
function printNow(title,html){
  $('#pa').innerHTML=`<h2 style="text-align:center;margin:0">سيتي جيم</h2><h3 style="text-align:center;margin:4px 0">${title}</h3><p style="text-align:center;margin:0 0 10px">${today()}</p>${html}`;
  document.body.classList.add('pr');
  setTimeout(()=>{try{window.print()}catch(e){alert('الطباعة مش متاحة هنا، افتح البرنامج في المتصفح مباشرة')}document.body.classList.remove('pr')},100);
}
const tbl=(h,r)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const pBtn=(k)=>`<button class="btn s g" onclick="prt('${k}')">🖨️ طباعة</button>`;
const repData=k=>{
  const ym=today().slice(0,7);
  if(k==='ren'){const l=D.m.filter(m=>D.p.some(p=>p.mid===m.id&&!p.skip&&p.date.startsWith(ym)));return{t:'الأعضاء المجددين هذا الشهر',h:['م','الاسم','الهاتف','المدفوع','التجديد القادم'],r:l.map((m,i)=>[i+1,esc(m.name),esc(m.phone||''),money(D.p.filter(p=>p.mid===m.id&&!p.skip&&p.date.startsWith(ym)).reduce((a,p)=>a+p.amount,0)),nextRenew(m)])}}
  if(k==='stp'){const l=D.m.filter(stopped);return{t:'الأعضاء الموقوفين',h:['م','الاسم','الهاتف','آخر إيقاف'],r:l.map((m,i)=>[i+1,esc(m.name),esc(m.phone||''),lastP(m).date])}}
  if(k==='dbt'){const l=D.m.filter(m=>debt(m)>0);return{t:'المديونيات',h:['م','الاسم','الهاتف','عدد الشهور','المبلغ'],r:l.map((m,i)=>[i+1,esc(m.name),esc(m.phone||''),debt(m),money(debtAmt(m))]),f:`<p><b>الإجمالي: ${money(l.reduce((a,m)=>a+debtAmt(m),0))}</b></p>`}}
  if(k==='pad'){const l=D.m.filter(m=>debt(m)===0&&!stopped(m));return{t:'الأعضاء اللي سددوا الاشتراك',h:['م','الاسم','الهاتف','الاشتراك','التجديد القادم'],r:l.map((m,i)=>[i+1,esc(m.name),esc(m.phone||''),money(curPrice(m)),nextRenew(m)])}}
  if(k==='mem')return{t:'كشف الأعضاء',h:['م','الاسم','الهاتف','الاشتراك','الحالة','التجديد القادم','المديونية'],r:D.m.map((m,i)=>[i+1,esc(m.name),esc(m.phone||''),money(curPrice(m)),stopped(m)?'موقوف':debt(m)>0?'عليه مديونية':'مسدد',nextRenew(m),debt(m)>0?money(debtAmt(m)):'-'])}
  if(k==='sum'){const ym2=today().slice(0,7),ind=D.m.filter(m=>debt(m)>0);return{t:'ملخص الجيم',h:['البند','القيمة'],r:[['إجمالي الأعضاء',D.m.length],['مسددين',D.m.filter(m=>debt(m)===0&&!stopped(m)).length],['عليهم مديونية',ind.length],['موقوفين',D.m.filter(stopped).length],['إجمالي المديونيات',money(ind.reduce((a,m)=>a+debtAmt(m),0))],['إيراد هذا الشهر',money(revMonth(ym2))],['زوار اليوم (يومي)',D.d.filter(x=>x.date===today()).length],['حضور اليوم',D.a.filter(a=>a.date===today()).length]]}}
};
function prt(k){const d=repData(k);printNow(d.t,tbl(d.h,d.r)+(d.f||''))}
let repK='';
function rep(){
  const b=[['ren','✅ المجددين'],['stp','⏸ الموقوفين'],['dbt','⚠️ المديونات'],['pad','💰 اللي سدد']];
  let h=`<div class="card"><div class="acts">${b.map(([k,n])=>`<button class="btn ${repK===k?'':'g'}" onclick="repK='${k}';rep()">${n}</button>`).join('')}</div></div>`;
  if(repK){const d=repData(repK);h+=`<div class="card"><div class="row"><b>${d.t} (${d.r.length})</b>${pBtn(repK)}</div>${d.r.length?`<div class="w">${tbl(d.h,d.r)}</div>${d.f||''}`:'<p class="mu">لا يوجد.</p>'}</div>`}
  $('#rep').innerHTML=h;
}


// رسالة الدفع بتتجهز بعد 5 دقايق
function qdone(id){D.q=D.q.filter(x=>x.id!==id);save();setTimeout(qchk,300)}
function qchk(){
  const now=Date.now();D.q=D.q.filter(x=>D.m.some(m=>m.id===x.mid));
  const rd=D.q.filter(x=>x.at<=now),wt=D.q.filter(x=>x.at>now);
  let h=rd.map(x=>{const m=D.m.find(v=>v.id===x.mid);return `<div class="alertb" style="background:var(--ok);color:#fff">✅ رسالة دفع جاهزة لـ ${esc(m.name)} <a class="btn s g" target="_blank" rel="noopener" href="https://wa.me/${phn(m)}?text=${encodeURIComponent(x.msg)}" onclick="qdone('${x.id}')">إرسال واتساب</a> <button class="btn s g" onclick="qdone('${x.id}')">تخطي</button></div>`}).join('');
  if(wt.length)h+=`<div class="mu" style="padding:4px 12px">⏳ ${wt.length} رسالة دفع هتتجهز بعد ${Math.ceil(Math.min(...wt.map(x=>x.at))-now>0?(Math.min(...wt.map(x=>x.at))-now)/6e4:0)} دقيقة (سيب البرنامج مفتوح)</div>`;
  $('#qb').innerHTML=h;
}
setInterval(qchk,5000);

let tab='dash',preMem='',armed='';

$('#cur').value=D.cur;
$('#cur').oninput=e=>{D.cur=e.target.value;save();render()};
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['dash','mem','day','att','pay','msg','rep','sett'].forEach(x=>$('#'+x).classList.toggle('hide',x!==t));render()}
const dOff=n=>{const d=new Date();d.setDate(d.getDate()-n);return fmt(d)};
const sumPaidD=l=>l.filter(x=>x.paid).reduce((a,x)=>a+x.amount,0);
const revMonth=ym=>D.p.filter(p=>p.date.startsWith(ym)).reduce((a,p)=>a+p.amount,0)+sumPaidD(D.d.filter(x=>x.pdate.startsWith(ym)));
function chart(){
  const vals=[],labs=[];
  for(let i=5;i>=0;i--){const ym=addM(today(),-i).slice(0,7);vals.push(revMonth(ym));labs.push(new Date(ym+'-01T00:00').toLocaleDateString('ar-EG',{month:'short'}))}
  const mx=Math.max(...vals,1);
  return `<div class="bars">${vals.map((v,i)=>`<div class="bar"><span>${v?v.toLocaleString('ar-EG'):''}</span><i style="height:${Math.round(v/mx*90)}px"></i><span>${labs[i]}</span></div>`).join('')}</div>`;
}
function wa(m){
  const p=(m.phone||'').replace(/\D/g,'').replace(/^0+/,'');if(!p)return '';
  const num=(D.cc&&!p.startsWith(D.cc)?D.cc:'')+p;
  const ls=[];for(let i=paidM(m);i<due(m);i++)ls.push('• شهر '+mname(addM(m.start,i))+' — تاريخ الاستحقاق: '+addM(m.start,i));
  const msg=`أهلًا ${m.name}،\nعليك اشتراك ${debt(m)} ${debt(m)>2?'شهور':debt(m)===2?'شهرين':'شهر'} بقيمة ${debtAmt(m)} ${D.cur}:\n${ls.join('\n')}\n\nبرجاء السداد. شكرًا`+sigs;
  return `<a class="btn s g" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(msg)}">تذكير واتساب</a>${skipBtn(m)}`;
}
const dleft=m=>Math.round((new Date(nextRenew(m)+'T00:00')-new Date(today()+'T00:00'))/864e5);
const SOON=3;
function waR(m){
  const p=(m.phone||'').replace(/\D/g,'').replace(/^0+/,'');if(!p)return '';
  const num=(D.cc&&!p.startsWith(D.cc)?D.cc:'')+p;
  const msg=`أهلًا ${m.name}، اشتراكك هيتجدد بعد ${dleft(m)} يوم (${nextRenew(m)}) بقيمة ${cyc(m,due(m))} ${D.cur}. شكرًا`;
  return `<a class="btn s g" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(msg)}">تذكير واتساب</a>${skipBtn(m)}`;
}
function soonCard(){
  const l=D.m.filter(m=>dleft(m)<=SOON).sort((a,b)=>dleft(a)-dleft(b));
  return `<div class="card"><b>🔔 تجديدات قريبة (خلال ${SOON} أيام)</b>${l.length?l.map(m=>`<div class="row"><div><b style="color:var(--wn)">${esc(m.name)}</b><div class="mu">${esc(m.phone||'')}</div></div><div><span class="tag wn">باقي ${dleft(m)} يوم</span><div class="mu">${nextRenew(m)} · ${money(cyc(m,due(m)))}</div></div>${waR(m)}</div>`).join(''):'<p class="mu">لا توجد تجديدات خلال الأيام القادمة.</p>'}</div>`;
}
function fltS(){go('mem');$('#fl').value='s';list()}
const mname=d=>new Date(d+'T00:00').toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
const opn={};
const tg=id=>{opn[id]=!opn[id];render()};
const monthsHtml=m=>{let h='';for(let i=paidM(m);i<due(m);i++)h+=`<span class="chip">${mname(addM(m.start,i))} — ${money(cyc(m,i))}</span>`;return `<div class="ms">${h}</div>`};
function render(){
  const sn=pend_('r3').sort((a,b)=>dleft(a)-dleft(b));
  $('#alertb').innerHTML=sn.length?`<div class="alertb" onclick="go('msg')">🔔 ${sn.length} ${sn.length>1?'أعضاء':'عضو'} اشتراكهم هينتهي خلال ${WIN()} أيام — اضغط وابعتلهم الرسالة: ${sn.map(m=>esc(m.name)+' (باقي '+dleft(m)+' يوم)').join('، ')}</div>`:'';
  $('#now').textContent='📅 الشهر الحالي: '+mname(today())+' · اليوم '+new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  ({dash,mem,day,att,pay,msg,rep,sett})[tab]();
}
function demo(){
  const t=today(),a=addM(t,-3),b=addM(t,-1),c=addM(t,0);
  const x={id:uid(),name:'أحمد محمد',phone:'01000000001',price:400,start:a,prices:[{from:a,price:400},{from:addM(a,2),price:450}]};
  const y={id:uid(),name:'محمود علي',phone:'01000000002',price:350,start:b,prices:[{from:b,price:350}]};
  const z={id:uid(),name:'سارة حسن',phone:'01000000003',price:500,start:c,prices:[{from:c,price:500}]};
  D.m.push(x,y,z);
  D.p.push({id:uid(),mid:x.id,amount:400,date:t,months:1},{id:uid(),mid:y.id,amount:700,date:t,months:2},{id:uid(),mid:z.id,amount:500,date:t,months:1});
  D.d.push({id:uid(),name:'زائر',amount:50,date:t,time:'18:30',paid:true,pdate:t},{id:uid(),name:'كريم',amount:50,date:t,time:'19:10',paid:false,pdate:''});
  D.demo=true;save();render();
}
async function clearDemo(){if(!await needPin('مسح البيانات التجريبية'))return;D.d=[];D.m=[];D.p=[];D.a=[];D.demo=false;save();render()}

function dash(){
  const t=today(),ym=t.slice(0,7);
  const ind=D.m.filter(m=>debt(m)>0).sort((a,b)=>debt(b)-debt(a));
  const totalDebt=ind.reduce((s,m)=>s+debtAmt(m),0);
  const rev=revMonth(ym),todayD=D.d.filter(x=>x.date===t);
  const all=D.p.reduce((s,p)=>s+p.amount,0)+sumPaidD(D.d);
  $('#dash').innerHTML=`<div class="acts" style="margin-bottom:10px">${pBtn('sum').replace('طباعة','طباعة الملخص')}</div><div class="grid">
  <div class="card stat"><span>إجمالي الأعضاء</span><b>${D.m.length}</b></div>
  <div class="card stat"><span>مدفوع</span><b style="color:var(--ok)">${D.m.length-ind.length}</b></div>
  <div class="card stat"><span>عليهم مديونية</span><b style="color:var(--er)">${ind.length}</b></div>
  <div class="card stat"><span>إجمالي المديونيات</span><b>${money(totalDebt)}</b></div>
  <div class="card stat"><span>زوار اليوم (يومي)</span><b>${todayD.length}</b></div>
  <div class="card stat"><span>حضور اليوم</span><b>${D.a.filter(a=>a.date===t).length}</b></div>
  <div class="card stat"><span>إيراد هذا الشهر</span><b>${money(rev)}</b></div>
  <div class="card stat"><span>إجمالي الإيرادات</span><b>${money(all)}</b></div></div>
  <div class="card"><b>📈 الإيرادات آخر 6 شهور</b>${chart()}</div>
  ${soonCard()}
  <div class="card"><div class="row"><b>⚠️ أعضاء عليهم مديونية</b>${pBtn('dbt').replace('طباعة','طباعة المديونيات')}</div>${ind.length?ind.map(m=>`<div class="row"><div>${esc(m.name)}<div class="mu">${esc(m.phone||'')}</div></div><div><b class="lnk" onclick="tg('${m.id}')">${debt(m)} شهر ${opn[m.id]?'▴':'▾'}</b><div class="mu">${money(debtAmt(m))}</div></div><button class="btn s" onclick="payFor('${m.id}')">دفع</button>${wa(m)}${opn[m.id]?`<div style="width:100%">${monthsHtml(m)}</div>`:''}</div>`).join(''):'<p class="mu">لا توجد مديونيات 👌</p>'}</div>`;
}

function mem(){
  $('#mem').innerHTML=(D.m.length===0?`<div class="card"><span class="mu">عايز تشوف البرنامج شغال؟</span> <button class="btn s" onclick="demo()">تجربة ببيانات تجريبية</button></div>`:D.demo?`<div class="card"><span class="mu">البيانات الحالية تجريبية.</span> <button class="btn s d" onclick="clearDemo()">مسح الكل والبدء من جديد</button></div>`:'')+`<div class="card"><b>إضافة عضو</b><div class="f" style="margin-top:10px">
  <div><label>الاسم</label><input id="n"></div>
  <div><label>الهاتف (اختياري)</label><input id="ph" type="tel"></div>
  <div><label>الاشتراك الشهري</label><input id="pr" type="number" min="0"></div>
  <div><label>تاريخ بداية الاشتراك (منه يتجدد كل شهر)</label><input id="sd" type="date" value="${today()}"></div>
  <div><label>دفع الشهر الأول؟</label><select id="pd"><option value="1">نعم</option><option value="0">لا</option></select></div>
  <button class="btn" onclick="addMem()">إضافة</button></div></div>
  <div class="card"><div style="margin-bottom:8px">${pBtn('mem').replace('طباعة','طباعة الأعضاء')}</div><div class="f"><input id="q" placeholder="🔍 بحث بالاسم أو الهاتف" oninput="list()"><select id="fl" onchange="list()"><option value="">الكل</option><option value="d">عليهم مديونية</option><option value="p">مدفوع</option><option value="s">تجديد خلال 3 أيام</option></select></div><div class="w" id="ml"></div></div>`;
  list();
}
function list(){
  const q=($('#q')?.value||'').trim(),fl=$('#fl')?.value||'';
  const r=D.m.map((m,i)=>({m,i})).filter(({m})=>(m.name.includes(q)||(m.phone||'').includes(q))&&(!fl||(fl==='d'?debt(m)>0:fl==='s'?dleft(m)<=SOON:debt(m)===0)));
  $('#ml').innerHTML=r.length?`<table><thead><tr><th>م</th><th>الاسم</th><th>الاشتراك الشهري</th><th>الدفع</th><th>المديونية</th><th>التجديد القادم</th><th>باقي للتجديد</th><th></th></tr></thead><tbody>${r.map(({m,i})=>{const d=debt(m),c=credit(m),dl=dleft(m),sn=dl<=SOON;return `<tr class="${sn?'soonrow':''}"><td>${i+1}</td><td><b ${sn?'style="color:var(--wn)"':''}>${sn?'🔔 ':''}${esc(m.name)}</b><div class="mu">${esc(m.phone||'')}</div></td><td><input class="pi" type="number" min="0" value="${curPrice(m)}" onchange="setPrice('${m.id}',this.value)"> ${esc(D.cur)}${(()=>{const f=m.prices.find(x=>x.from>today());return f?`<div class="mu">${f.price} من ${f.from}</div>`:''})()}</td><td><span class="tag ${d?'no':'yes'}">${d?'لا':'نعم'}</span>${c?`<div class="mu">مقدّم ${c} شهر</div>`:''}</td><td>${d?`<b class="lnk" onclick="tg('${m.id}')">${d} شهر ${opn[m.id]?'▴':'▾'}</b><div class="mu">${money(debtAmt(m))}</div>`:'<span class="mu">لا يوجد</span>'}</td><td>${nextRenew(m)}</td><td><span class="tag ${sn?'wn':'yes'}">${sn?'🔔 ':''}باقي ${dl} يوم</span></td><td><div class="acts"><button class="btn s" onclick="payFor('${m.id}')">دفع</button>${d?wa(m):''}<button class="btn s g" onclick="ed('${m.id}')">تعديل</button><button class="btn s g" onclick="chIn('${m.id}')">حضور</button><button class="btn s d" onclick="del('${m.id}')">${armed===m.id?'تأكيد؟':'حذف'}</button></div></td></tr>${opn[m.id]&&d?`<tr><td colspan="8">${monthsHtml(m)}</td></tr>`:''}${edt===m.id?editRow(m):''}`}).join('')}</tbody></table>`:'<p class="mu">لا يوجد أعضاء.</p>';
}
let edt='';
function editRow(m){
  return `<tr><td colspan="8"><div class="f"><div><label>الاسم</label><input id="en" value="${esc(m.name)}"></div><div><label>الهاتف</label><input id="ep" value="${esc(m.phone||'')}"></div><div><label>يوم بداية الاشتراك</label><input id="es" type="date" value="${m.start}"></div><div class="acts"><button class="btn" onclick="svEd('${m.id}')">حفظ</button><button class="btn g" onclick="ed('')">إلغاء</button></div></div><p class="mu">تغيير يوم البداية بيغيّر يوم التجديد الشهري وحساب المديونية. الدفعات المسجّلة تفضل كما هي.</p></td></tr>`;
}
async function ed(id){if(id&&edt!==id&&!await needPin('تعديل بيانات العضو'))return;edt=edt===id?'':id;list()}
function svEd(id){
  const m=D.m.find(x=>x.id===id),n=$('#en').value.trim(),sd=$('#es').value;
  if(!m||!n||!sd){alert('اكتب الاسم وتاريخ البداية');return}
  if(sd!==m.start){
    const first=m.prices[0].price;
    m.prices=[{from:sd,price:first}].concat(m.prices.slice(1).filter(x=>x.from>sd));
    m.start=sd;
  }
  m.name=n;m.phone=$('#ep').value.trim();
  edt='';save();list();
}
async function setPrice(id,v){
  const m=D.m.find(x=>x.id===id);v=+v;
  if(!m||!(v>=0)||$('#q')===null)return;
  if(v!==curPrice(m)&&!await needPin('تعديل الاشتراك الشهري')){list();return}
  if(v===curPrice(m)){list();return}
  const from=due(m)===0?m.start:nextRenew(m);
  m.prices=m.prices.filter(x=>x.from<from);
  m.prices.push({from,price:v});
  m.prices.sort((a,b)=>a.from.localeCompare(b.from));
  save();list();
}
function addMem(){
  const n=$('#n').value.trim(),sd=$('#sd').value;
  if(!n||!sd||$('#pr').value===''||+$('#pr').value<0){alert('اكتب الاسم والاشتراك الشهري وتاريخ البداية');return}
  const m={id:uid(),name:n,phone:$('#ph').value.trim(),price:+$('#pr').value,start:sd,prices:[{from:sd,price:+$('#pr').value}]};
  D.m.push(m);
  if($('#pd').value==='1')D.p.push({id:uid(),mid:m.id,amount:m.prices[0].price,date:today(),months:1});
  save();mem();
}
async function del(id){
  if(!await needPin('حذف العضو وكل بياناته'))return;
  D.m=D.m.filter(m=>m.id!==id);D.a=D.a.filter(a=>a.mid!==id);D.p=D.p.filter(p=>p.mid!==id);armed='';save();list();
}
function payFor(id){preMem=id;go('pay')}
function chIn(id){
  if(D.a.some(a=>a.mid===id&&a.date===today()))return;
  D.a.push({id:uid(),mid:id,date:today(),time:new Date().toTimeString().slice(0,5)});
  save();render();
}

function att(){
  const t=today(),ts=D.a.filter(a=>a.date===t);
  $('#att').innerHTML=`<div class="card"><b>تسجيل حضور</b><div class="f" style="margin-top:10px"><div><label>العضو</label><select id="am">${D.m.map(m=>`<option value="${m.id}">${esc(m.name)}${debt(m)?' (عليه مديونية)':''}</option>`).join('')}</select></div><button class="btn" onclick="chIn($('#am').value)">تسجيل الحضور</button></div></div>
  <div class="card"><b>حضور اليوم (${ts.length})</b>${ts.length?ts.map(a=>{const m=D.m.find(x=>x.id===a.mid);return m?`<div class="row"><div>${esc(m.name)}</div><div>${a.time} ${debt(m)?`<span class="tag no">عليه ${debt(m)} شهر</span>`:''}</div></div>`:''}).join(''):'<p class="mu">لم يسجّل أحد بعد.</p>'}</div>`;
}

function pay(){
  const ym=today().slice(0,7);
  const sel=D.m.find(m=>m.id===preMem)||D.m[0];
  const mo=sel?(debt(sel)||1):1;
  $('#pay').innerHTML=`<div class="card"><b>تسجيل دفعة</b><div class="f" style="margin-top:10px">
  <div><label>العضو</label><select id="pm" onchange="fill(1)">${D.m.map(m=>`<option value="${m.id}" ${sel&&m.id===sel.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
  <div><label>عدد الأشهر</label><input id="pn" type="number" min="1" value="${mo}" oninput="fill()"></div>
  <div><label>المبلغ</label><input id="pa" type="number" min="0" value="${sel?sumC(sel,paidM(sel),paidM(sel)+mo):''}"></div>
  <button class="btn" onclick="addPay()">حفظ الدفعة</button></div></div>
  <div class="card"><b>إيراد الاشتراكات هذا الشهر: ${money(D.p.filter(p=>p.date.startsWith(ym)).reduce((s,p)=>s+p.amount,0))}</b>
  ${D.p.length?[...D.p].reverse().map(p=>{const m=D.m.find(x=>x.id===p.mid);return `<div class="row"><div>${m?esc(m.name):'عضو محذوف'}<div class="mu">${p.date} · ${p.months||1} شهر</div></div><b>${p.skip?'إلغاء شهر':money(p.amount)}</b><button class="btn s d" onclick="delP('${p.id}')">حذف</button>${!p.skip&&m&&phn(m)?`<button class="btn s g" onclick="payAsk('${m.id}','${p.id}')">${p.msg?'📩 إعادة الإرسال':'📩 رسالة'}</button>`:''}</div>`}).join(''):'<p class="mu">لا توجد مدفوعات.</p>'}</div>`;
  preMem='';
}

function payAsk(mid,pid){
  const m=D.m.find(x=>x.id===mid),p=D.p.find(x=>x.id===pid);if(!m||!p)return;
  const old=document.getElementById('pq');if(old)old.remove();
  const d=document.createElement('div');d.id='pq';
  d.style.cssText='position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box';
  const can=phn(m)&&debt(m)===0,again=!!p.msg;
  d.innerHTML=`<div class="card" style="max-width:340px;width:100%;text-align:center;margin:0"><div style="font-size:34px">✅</div><b>تم تسجيل دفع ${esc(m.name)}</b><p class="mu">المبلغ: ${money(p.amount)}${debt(m)>0?'<br>⚠️ لسه عليه مديونية '+money(debtAmt(m)):''}${!phn(m)?'<br>لا يوجد رقم هاتف للعضو':''}</p>${can?`<p>${again?'اتبعتله رسالة قبل كده. هل تود إرسالها مرة أخرى؟':'هل تود إرسال رسالة تأكيد على واتساب؟'}</p><div class="acts" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${phn(m)}?text=${encodeURIComponent(msgPaid(m))}" onclick="payOk('${p.id}')">${again?'إرسال مرة أخرى':'نعم، إرسال'}</a><button class="btn g" onclick="document.getElementById('pq').remove()">لا</button></div>`:`<div class="acts" style="justify-content:center"><button class="btn" onclick="document.getElementById('pq').remove()">تمام</button></div>`}</div>`;
  document.body.appendChild(d);
}
function payOk(pid){const p=D.p.find(x=>x.id===pid);if(p){p.msg=1;save()}setTimeout(()=>{const e=document.getElementById('pq');if(e)e.remove();if(tab==='pay')pay()},300)}
function fill(reset){
  const m=D.m.find(x=>x.id===$('#pm').value);if(!m)return;
  if(reset)$('#pn').value=debt(m)||1;
  $('#pa').value=sumC(m,paidM(m),paidM(m)+(+$('#pn').value||1));
}
function addPay(){
  const m=D.m.find(x=>x.id===$('#pm').value),n=+$('#pn').value;
  if(!m||!(n>=1)||$('#pa').value===''||+$('#pa').value<0){alert('اختر عضوًا واكتب المبلغ وعدد الأشهر');return}
  if(D.p.some(x=>x.mid===m.id&&x.date===today()&&!x.skip)&&armed!=='dup'+m.id){armed='dup'+m.id;setTimeout(()=>armed='',6000);alert('⚠️ العضو ده اتسجله دفع النهاردة بالفعل. لو متأكد إنها دفعة جديدة اضغط «حفظ الدفعة» تاني.');return}
  armed='';D.p.push({id:uid(),mid:m.id,amount:+$('#pa').value,date:today(),months:n});
  save();pay();
  payAsk(m.id,D.p[D.p.length-1].id);
}
function day(){
  const t=today(),ts=D.d.filter(x=>x.date===t);
  const got=sumPaidD(ts.filter(x=>x.pdate===t)),owed=ts.filter(x=>!x.paid).reduce((a,x)=>a+x.amount,0);
  let hist='';
  for(let i=0;i<7;i++){const d=dOff(i),l=D.d.filter(x=>x.date===d);hist+=`<div class="row"><div>${d}${i===0?' (اليوم)':''}</div><div class="mu">${l.length} زائر</div><b>${money(sumPaidD(l))}</b></div>`}
  $('#day').innerHTML=`<div class="card"><b>تسجيل زائر يومي (بدون اشتراك)</b><div class="f" style="margin-top:10px">
  <div><label>الاسم (اختياري)</label><input id="dn"></div>
  <div><label>سعر اليوم</label><input id="da" type="number" min="0" value="${D.dp??''}"></div>
  <div><label>الدفع</label><select id="dpd"><option value="1">دفع</option><option value="0">لم يدفع بعد</option></select></div>
  <button class="btn" onclick="addDay()">تسجيل</button></div></div>
  <div class="grid"><div class="card stat"><span>زوار اليوم</span><b>${ts.length}</b></div><div class="card stat"><span>المحصّل</span><b style="color:var(--ok)">${money(got)}</b></div><div class="card stat"><span>لم يدفعوا</span><b style="color:var(--er)">${money(owed)}</b></div></div>
  <div class="card"><b>زوار اليوم</b>${ts.length?`<div class="w"><table><thead><tr><th>م</th><th>الاسم</th><th>الوقت</th><th>المبلغ</th><th>الدفع</th><th></th></tr></thead><tbody>${ts.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.time}</td><td>${money(x.amount)}</td><td><span class="tag ${x.paid?'yes':'no'}">${x.paid?'نعم':'لا'}</span></td><td><div class="acts">${x.paid?'':`<button class="btn s" onclick="collectD('${x.id}')">تحصيل</button>`}<button class="btn s d" onclick="delD('${x.id}')">${armed===x.id?'تأكيد؟':'حذف'}</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="mu">لا يوجد زوار اليوم.</p>'}</div>
  <div class="card"><b>آخر 7 أيام (المحصّل)</b>${hist}</div>`;
}
function addDay(){
  const a=$('#da').value;
  if(a===''||+a<0){alert('اكتب سعر اليوم');return}
  const t=today(),paid=$('#dpd').value==='1';
  D.dp=+a;
  D.d.push({id:uid(),name:$('#dn').value.trim()||'زائر',amount:+a,date:t,time:new Date().toTimeString().slice(0,5),paid,pdate:paid?t:''});
  save();day();
}
function collectD(id){const x=D.d.find(v=>v.id===id);if(x){x.paid=true;x.pdate=today();save();day()}}
async function delD(id){
  if(!await needPin('حذف الزائر'))return;
  D.d=D.d.filter(x=>x.id!==id);armed='';save();day();
}
function sett(){
  $('#sett').innerHTML=`<div class="card"><b>واتساب</b><div class="f" style="margin-top:10px"><div><label>كود الدولة (مثلًا 20 لمصر)</label><input id="cc" value="${esc(D.cc)}" oninput="D.cc=this.value.replace(/\\D/g,'');save()"></div></div><p class="mu">زرار «تذكير واتساب» بيظهر للأعضاء اللي عليهم مديونية ولهم رقم هاتف.</p></div>
  <div class="card"><b>الرقم السري</b><p class="mu">مطلوب عند فتح البرنامج وعند حذف أو تعديل أي عضو.</p><button class="btn" onclick="chPw()">تغيير الرقم السري</button></div>
  <div class="card"><b>مسح كل البيانات</b><p class="mu">بيصفّر الأعضاء والمدفوعات والإيرادات ويبدأ من الأول. الرقم السري والعملة بيفضلوا. انسخ نسخة احتياطية الأول لو محتاجها.</p><button class="btn d" onclick="resetAll()">🗑️ مسح كل البيانات والبدء من الصفر</button><p class="mu" id="rsm"></p></div>
  <div class="card"><b>نسخة احتياطية</b><p class="mu">البيانات محفوظة في متصفح الجهاز ده فقط. انسخ النص ده واحفظه في مكان آمن، ولو احتجت ترجّعه الصقه هنا واضغط استرجاع.</p>
  <textarea id="bk" rows="6" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:12px;direction:ltr">${esc(JSON.stringify(D))}</textarea>
  <div class="acts" style="margin-top:10px"><button class="btn" onclick="cpBk()">نسخ</button><button class="btn g" onclick="rsBk()">استرجاع من النص</button></div><p class="mu" id="bkm"></p></div>`;
}
async function resetAll(){
  if(armed!=='rs'){armed='rs';$('#rsm').textContent='⚠️ هيتمسح كل حاجة (الأعضاء والمدفوعات والإيرادات والحضور). لو متأكد اضغط الزرار تاني خلال 5 ثواني.';setTimeout(()=>{armed='';const e=$('#rsm');if(e)e.textContent=''},5000);return}
  armed='';
  if(!await needPin('مسح كل البيانات والبدء من الصفر'))return;
  D={m:[],p:[],a:[],d:[],cur:D.cur,cc:D.cc,s:{},q:[]};save();go('dash');
}
async function delP(id){
  if(!await needPin('حذف الدفعة'))return;
  D.p=D.p.filter(x=>x.id!==id);save();pay();
}
function cpBk(){
  const t=$('#bk');t.select();
  try{navigator.clipboard.writeText(t.value).then(()=>$('#bkm').textContent='تم النسخ ✅',()=>$('#bkm').textContent='حدّد النص وانسخه يدويًا')}catch(e){$('#bkm').textContent='حدّد النص وانسخه يدويًا'}
}
async function rsBk(){
  try{
    const o=JSON.parse($('#bk').value);
    if(!Array.isArray(o.m)||!Array.isArray(o.p)||!Array.isArray(o.a))throw 0;
    if(!await needPin('استرجاع نسخة احتياطية (هيستبدل كل البيانات)'))return;
    D=o;if(!D.s)D.s={};if(!D.q)D.q=[];if(!D.d)D.d=[];if(D.cc===undefined)D.cc='20';D.m.forEach(m=>{if(!m.prices)m.prices=[{from:m.start,price:m.price}]});
    armed='';save();$('#cur').value=D.cur;go('dash');
  }catch(e){$('#bkm').textContent='النص غير صالح'}
}
render();
qchk();
openLock();
try{const lg=document.querySelector('img.logo');if(lg){['icon','apple-touch-icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=lg.src;document.head.appendChild(l)})}
const t=document.createElement('meta');t.name='theme-color';t.content='#e8590c';document.head.appendChild(t);
const a2=document.createElement('meta');a2.name='apple-mobile-web-app-capable';a2.content='yes';document.head.appendChild(a2);
const a3=document.createElement('meta');a3.name='mobile-web-app-capable';a3.content='yes';document.head.appendChild(a3);
document.title='سيتي جيم'}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
